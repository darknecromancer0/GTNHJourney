name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Apply GTNH formatting
        run: gradle spotlessApply --stacktrace
      - name: Forge build
        run: gradle build --stacktrace
      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gtnhjourney-jars
          path: build/libs/*.jar
          if-no-files-found: error
